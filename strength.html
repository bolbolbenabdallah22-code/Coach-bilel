<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Strength Program</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        .container {
            padding: 50px 20px;
        }

        h1 {
            font-size: 36px;
        }

        .workout {
            background: #222;
            margin: 15px auto;
            padding: 18px;
            border-radius: 15px;
            max-width: 350px;
            text-align: left;
        }

        .workout h2 {
            margin-top: 0;
        }

        .back {
            margin-top: 25px;
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>💪 Strength Program</h1>

        <p>Build strength and muscle.</p>

        <div class="workout">
            <h2>Day 1 — Chest</h2>
            <p>Bench Press — 4 × 10</p>
            <p>Incline Press — 3 × 10</p>
            <p>Chest Fly — 3 × 12</p>
        </div>

        <div class="workout">
            <h2>Day 2 — Back</h2>
            <p>Lat Pulldown — 4 × 10</p>
            <p>Seated Row — 3 × 10</p>
            <p>Face Pull — 3 × 15</p>
        </div>

        <div class="workout">
            <h2>Day 3 — Legs</h2>
            <p>Squat — 4 × 8</p>
            <p>Leg Press — 3 × 10</p>
            <p>Leg Curl — 3 × 12</p>
        </div>

        <button class="back" onclick="history.back()">
            ← Back
        </button>

    </div>

</body>

      </html>
